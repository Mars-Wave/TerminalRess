name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Really publish to the PowerShell Gallery (unchecked = dry run)'
        type: boolean
        default: false

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            exe: powershell.exe
          - name: PowerShell 7
            exe: pwsh.exe
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        shell: pwsh
        run: |
          & ${{ matrix.exe }} -NoProfile -Command { $ErrorActionPreference = 'Stop'; Test-ModuleManifest ./TerminalRess/TerminalRess.psd1 | Format-List Name, Version, Author }
          exit $LASTEXITCODE

      - name: Run tests
        shell: pwsh
        run: |
          & ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File ./tests/Run-Tests.ps1
          exit $LASTEXITCODE

  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze (errors fail the build)
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./TerminalRess -Recurse -Severity Error, Warning
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 300
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { throw "$($errors.Count) PSScriptAnalyzer error(s)" }

  publish:
    name: Publish to PowerShell Gallery
    needs: [test, analyze]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish (dry run unless tag push or publish=true)
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          REAL: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Test-ModuleManifest ./TerminalRess/TerminalRess.psd1).Version.ToString()
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match manifest version $version"
          }
          if (-not $env:PSGALLERY_API_KEY) { throw 'PSGALLERY_API_KEY secret is not set' }

          $existing = Find-PSResource -Name TerminalRess -Repository PSGallery -ErrorAction SilentlyContinue
          if ($existing) {
            "On the Gallery: $($existing.Name) $($existing.Version) by $($existing.Author)"
            if ($existing.Version.ToString() -eq $version) { throw "TerminalRess $version is already published" }
          } else {
            'TerminalRess is not on the Gallery yet (name available or unlisted)'
          }

          $real = $env:REAL -eq 'true'
          "Publishing TerminalRess $version (real: $real)"
          Publish-PSResource -Path ./TerminalRess -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -WhatIf:(-not $real) -Verbose
